name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      # クリーンアップ/ギャップ修復の回帰テスト。
      # 実データフィクスチャ（アクアライン・湾岸線）で「壊してはいけないものを壊さない」を保証する
      - name: Run regression tests
        working-directory: web
        run: npx vitest run

      - name: Type check
        working-directory: web
        run: npx tsc -b
